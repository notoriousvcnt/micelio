; ============================================================
; MICELIO - firmware ESP32
; Reconstruido a partir del codigo: el platformio.ini original
; no estaba versionado. Los flags salen de los #ifdef de
; src/ESP32_LD2410_SV5W_WS2812B.cpp. REVISAR los marcados TODO.
; ============================================================

[platformio]
default_envs = esp32-dy-sv5w

[env]
platform = espressif32
framework = arduino
board = esp32dev
; TODO: confirmar la placa real
monitor_speed = 115200
upload_speed = 921600
; TODO: fijar versiones probadas de las librerias
; TODO: confirmar fuente de DYPlayerArduino y AsyncTCP
lib_deps =
    fastled/FastLED
    ESP Async WebServer
    ayushsharma82/WebSerial
; Credenciales WiFi: copiar include/secrets.example.h a include/secrets.h
build_flags =
    -DSENSOR
    -DWIFI
    -DWEBSERIAL
    -DWS2812b
    -DPWMLeds
    ; --- Datos por dispositivo (cambiar en cada placa) ---
    -DDEVICE_NAME=\"micelio-1\"
    -DDEVICE_IP=\"192.168.1.101\"
    -DDEVICE_NUMBER=0
    -DGATEWAY_IP=\"192.168.1.1\"
    -DSUBNET_IP=\"255.255.255.0\"
    ; Descomentar solo para grabar nombre/IP/numero en NVS la primera vez:
    ; -DUPLOAD_DEVICE_PROPERTIES

; Variante A: audio con modulo DY-SV5W (por defecto)
[env:esp32-dy-sv5w]

; Variante B: audio con Raspberry Pi Zero 2 W + Pure Data
[env:esp32-rpi]
build_flags =
    ${env.build_flags}
    -DRASPI

; Variante C: "capullo", 1200 LEDs
[env:esp32-capullo]
build_flags =
    ${env.build_flags}
    -DCAPULLO

; Pruebas de las 5 tiras WS2812B y los 5 canales PWM
[env:esp32-test-pines]
build_flags =
    ${env.build_flags}
    -DTEST_RGB_PINS
    -DTEST_PWM_PINS
